# Inkdesk — Render Blueprint
#
# One web service. SQLite + parlor image uploads MUST live on a persistent disk;
# the instance filesystem is wiped on every deploy.
#
# Plan: starter (or larger). Persistent disks are not available on the free instance.
# A disk also pins the service to a single instance (no autoscaling / no zero-downtime).
# 1 GB is enough for beta SQLite + JPEG/PNG/WebP references. Raise sizeGB later if needed
# (grow-only; shrinking is not supported).
#
# Do not set NODE_ENV=production here — it would skip devDependencies (TypeScript, Prisma CLI)
# during `npm ci`. Render sets NODE_ENV at runtime.
#
# First-sync secrets (sync: false) are prompted in the Dashboard. Paste:
#   DATABASE_URL          file:/var/data/inkdesk.db
#   AUTH_SECRET           output of: openssl rand -base64 32
#   NEXT_PUBLIC_APP_URL   https://<this-service>.onrender.com   (no trailing slash)
#
# Do NOT add prisma db seed to startCommand — seed wipes shops, users, and storage/shops.

services:
  - type: web
    name: inkdesk
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: mkdir -p /var/data/storage && npx prisma migrate deploy && npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Uploads on the persistent disk (same volume as SQLite).
      - key: STORAGE_ROOT
        value: /var/data/storage
      # Optional local-dev Stripe fallback only. Per-parlor keys live in the shop row
      # (Admin → Settings). Do not invent a shared platform Stripe account.
      # STRIPE_SECRET_KEY, NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET
    disk:
      name: inkdesk-data
      mountPath: /var/data
      sizeGB: 1
